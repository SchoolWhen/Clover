# registry/hypotheses.yaml
# H1-H15 from 04-innovation/README.md (falsifier texts quoted/paraphrased from
# the source). Numeric kill_thresholds are NOT set in the source documents;
# per sequence 2.7 they must be locked at preregistration time -- recorded
# here as UNSET_AT_PREREGISTRATION rather than invented.
# status for all: OPEN_UNMEASURED (EV0-EV8 measured evidence is zero; see STATUS.md).

hypotheses:
  - id: H1
    name: "Evidence Replay / Dual Memory"
    falsifier: "learned recurrent/contextual state matches or exceeds long-occlusion continuity, belief revision and memory cost without replay"
    falsifier_metric: "long-occlusion continuity + belief-revision accuracy at equal byte budget"
    kill_threshold: UNSET_AT_PREREGISTRATION
    target_experiment_script: "src/clover/innovation/dual_memory_replay.py"
    status: OPEN_UNMEASURED
  - id: H2
    name: "Visual World Compiler"
    falsifier: "a unified learned world model handles revision, queries and provenance more simply/robustly"
    falsifier_metric: "revision/query/provenance task suite vs unified learned baseline"
    kill_threshold: UNSET_AT_PREREGISTRATION
    target_experiment_script: "src/clover/innovation/sparse_event_ir.py"
    status: OPEN_UNMEASURED
  - id: H3
    name: "Query-Sufficient Representation"
    falsifier: "representations failing the sufficiency diagnostics nevertheless generalize and act better in full embodied evaluation"
    falsifier_metric: "ReversibilityProbe recovery of undeclared query features"
    kill_threshold: UNSET_AT_PREREGISTRATION
    target_experiment_script: "src/clover/probes/diagnostics.py"
    status: OPEN_UNMEASURED
  - id: H4
    name: "Query-Conditioned Temporal Persistence"
    falsifier: "adaptive persistence gives no capability/memory advantage at matched compute"
    falsifier_metric: "capability per byte across timescales at matched compute"
    kill_threshold: UNSET_AT_PREREGISTRATION
    target_experiment_script: "src/clover/innovation/dual_memory_replay.py"
    status: OPEN_UNMEASURED
  - id: H5
    name: "Separate Epistemic State from Verification State"
    falsifier: "simpler unified probabilistic state provides equal correctness, revision, refusal and planning without semantic confusion"
    falsifier_metric: "correctness/revision/refusal/planning parity vs unified probabilistic state"
    kill_threshold: UNSET_AT_PREREGISTRATION
    target_experiment_script: "src/clover/innovation/dual_memory_replay.py"
    status: OPEN_UNMEASURED
  - id: H6
