  - id: H15
    name: "Worldview Value Must Be Proven Through Action"
    falsifier: "matched strong policy without the explicit worldview equals it on unseen-scene transfer, sample efficiency, planning/search, world-change recovery, unjustified-action rate, long-horizon success, diagnosis/revision"
    falsifier_metric: "the seven action-value axes above, matched policy +/- worldview"
    kill_threshold: UNSET_AT_PREREGISTRATION
    target_experiment_script: "experiments/exp5_h15_r7_boundary.py"
