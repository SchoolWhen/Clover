[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clover"
version = "0.1.0"
description = "Clover — machine-native worldview model research codebase (Stage: implementation scaffolding + harness/probes/benchmarks/innovation prototypes)"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pyyaml>=6.0"]
license = { text = "Apache-2.0" }

[project.optional-dependencies]
models = ["torch", "transformers", "ultralytics"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
